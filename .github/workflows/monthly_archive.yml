name: Monthly parking archive

on:
  schedule:
    # 01:30 Asia/Bangkok on the first day (cron is UTC).
    - cron: "30 18 28-31 * *"
  workflow_dispatch:

concurrency:
  group: parking-data-maintenance
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Archive old RawData rows
        env:
          GOOGLE_SPREADSHEET_URL: ${{ secrets.GOOGLE_SPREADSHEET_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SCHEDULED_FLAG: ${{ github.event_name == 'schedule' && '--scheduled' || '' }}
        run: python scripts/archive_old_parking_data.py --execute --yes $SCHEDULED_FLAG
      - name: Refresh MonthlyRanking archive sources
        env:
          GOOGLE_SPREADSHEET_URL: ${{ secrets.GOOGLE_SPREADSHEET_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/repair_monthly_ranking.py --execute --yes
