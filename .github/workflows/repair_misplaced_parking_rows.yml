name: Repair misplaced parking rows

on:
  workflow_dispatch:
    inputs:
      execute:
        description: "Create a backup and move misplaced M:P rows back to A:D"
        required: true
        type: boolean
        default: false

concurrency:
  group: parking-data-maintenance
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Inspect or repair misplaced rows
        env:
          GOOGLE_SPREADSHEET_URL: ${{ secrets.GOOGLE_SPREADSHEET_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MODE: ${{ inputs.execute && '--execute --yes' || '--dry-run' }}
        run: python scripts/repair_misplaced_parking_rows.py $MODE
