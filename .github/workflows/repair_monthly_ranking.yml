name: Repair monthly parking ranking

on:
  workflow_dispatch:
    inputs:
      execute:
        description: "Back up and update MonthlyRanking to use the selected month only"
        required: true
        type: boolean
        default: false

concurrency:
  group: parking-data-maintenance
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Inspect or repair MonthlyRanking
        env:
          GOOGLE_SPREADSHEET_URL: ${{ secrets.GOOGLE_SPREADSHEET_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MODE: ${{ inputs.execute && '--execute --yes' || '--dry-run' }}
        run: python scripts/repair_monthly_ranking.py $MODE
